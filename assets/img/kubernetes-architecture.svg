<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" role="img" aria-labelledby="t d">
  <title id="t">Kubernetes architecture and SIEM log sources</title>
  <desc id="d">Kubernetes control plane (kube-apiserver, etcd, kube-scheduler, kube-controller-manager, cloud-controller-manager), worker nodes (kubelet, kube-proxy, pods, container runtime, Linux kernel), and the log sources that are collected and forwarded to a SIEM.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e8ecf1; }
      .h1 { font-size: 24px; font-weight: 700; }
      .sub { font-size: 13px; fill: #9aa4b2; }
      .zone { font-size: 13px; font-weight: 700; letter-spacing: .08em; }
      .cmp { font-size: 14px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
      .cmps { font-size: 11px; fill: #e2e8f0; text-anchor: middle; }
      .lbl { font-size: 12px; fill: #c4ccd6; }
      .lblc { font-size: 12px; fill: #c4ccd6; text-anchor: middle; }
      .badge { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .siem { font-size: 12.5px; fill: #e2e8f0; }
      .siemh { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .link { stroke: #8b949e; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="780" rx="18" fill="#1f232a"/>
  <text x="40" y="46" class="h1">Kubernetes Architecture &amp; SIEM Log Sources</text>
  <text x="40" y="70" class="sub">Core components, how they talk to each other, and where security telemetry (numbered) is collected for detection.</text>

  <!-- ===== Clients ===== -->
  <text x="30" y="112" class="zone" fill="#9aa4b2">CLIENTS</text>
  <rect x="30" y="124" width="170" height="54" rx="10" fill="#272c34" stroke="#4a525e"/>
  <text x="115" y="148" class="lblc" font-weight="600">kubectl / Admins</text>
  <text x="115" y="166" class="lblc">OIDC · certs · tokens</text>
  <rect x="30" y="192" width="170" height="54" rx="10" fill="#272c34" stroke="#4a525e"/>
  <text x="115" y="216" class="lblc" font-weight="600">CI/CD · GitOps</text>
  <text x="115" y="234" class="lblc">Argo CD · Flux · Helm</text>
  <rect x="30" y="566" width="170" height="54" rx="10" fill="#272c34" stroke="#4a525e"/>
  <text x="115" y="590" class="lblc" font-weight="600">End users / Internet</text>
  <text x="115" y="608" class="lblc">Ingress · LoadBalancer</text>

  <!-- ===== Control plane ===== -->
  <rect x="230" y="96" width="630" height="290" rx="14" fill="#1b2438" stroke="#4a7ff0" stroke-width="2"/>
  <text x="248" y="120" class="zone" fill="#7fa6ff">CONTROL PLANE</text>

  <rect x="390" y="138" width="300" height="72" rx="12" fill="#326ce5"/>
  <text x="540" y="168" class="cmp" font-size="17">kube-apiserver</text>
  <text x="540" y="190" class="cmps">AuthN · AuthZ (RBAC) · Admission · REST API :6443</text>

  <!-- second row -->
  <rect x="250" y="252" width="140" height="62" rx="10" fill="#1e4fb8"/>
  <text x="320" y="279" class="cmp">etcd</text>
  <text x="320" y="298" class="cmps">cluster state · Secrets</text>
  <rect x="402" y="252" width="140" height="62" rx="10" fill="#326ce5"/>
  <text x="472" y="279" class="cmp">kube-scheduler</text>
  <text x="472" y="298" class="cmps">pod → node placement</text>
  <rect x="554" y="252" width="140" height="62" rx="10" fill="#326ce5"/>
  <text x="624" y="275" class="cmp" font-size="13">kube-controller-</text>
  <text x="624" y="291" class="cmp" font-size="13">manager</text>
  <text x="624" y="306" class="cmps">reconcile loops</text>
  <rect x="706" y="252" width="140" height="62" rx="10" fill="#326ce5"/>
  <text x="776" y="275" class="cmp" font-size="13">cloud-controller-</text>
  <text x="776" y="291" class="cmp" font-size="13">manager</text>
  <text x="776" y="306" class="cmps">LB · routes · nodes</text>

  <path class="link" d="M540,210 L540,232 L320,232 L320,252"/>
  <path class="link" d="M472,232 L472,252"/>
  <path class="link" d="M540,232 L624,232 L624,252"/>
  <path class="link" d="M624,232 L776,232 L776,252"/>

  <text x="248" y="346" class="lbl">Admission webhooks · Pod Security Admission · Kyverno / Gatekeeper</text>
  <text x="248" y="366" class="lbl">Only the API server talks to etcd (mTLS :2379)</text>

  <!-- client arrows -->
  <path class="link" d="M200,150 L388,162" marker-end="url(#arr)"/>
  <path class="link" d="M200,218 L388,196" marker-end="url(#arr)"/>

  <!-- ===== Cloud provider ===== -->
  <rect x="885" y="244" width="120" height="78" rx="10" fill="#272c34" stroke="#4a525e"/>
  <text x="945" y="270" class="lblc" font-weight="600">Cloud Provider</text>
  <text x="945" y="287" class="lblc" font-weight="600">API</text>
  <text x="945" y="306" class="lblc" font-size="11">IAM · LB · disks</text>
  <path class="link" d="M846,283 L883,283" marker-end="url(#arr)"/>

  <!-- ===== Control plane → nodes bus ===== -->
  <path class="link" d="M545,386 L545,406 L310,406 L310,454" marker-end="url(#arr)"/>
  <path class="link" d="M545,406 L635,406 L635,454" marker-end="url(#arr)"/>
  <text x="556" y="400" class="lbl" font-size="11">watch / status · kubelet API :10250</text>

  <!-- ===== Worker nodes ===== -->
  <g>
    <rect x="230" y="420" width="305" height="320" rx="14" fill="#15291f" stroke="#2fa877" stroke-width="2"/>
    <text x="246" y="442" class="zone" fill="#4ade80">WORKER NODE 1</text>
    <rect x="245" y="456" width="130" height="46" rx="9" fill="#059669"/>
    <text x="310" y="477" class="cmp">kubelet</text>
    <text x="310" y="494" class="cmps">node agent</text>
    <rect x="390" y="456" width="130" height="46" rx="9" fill="#059669"/>
    <text x="455" y="477" class="cmp">kube-proxy</text>
    <text x="455" y="494" class="cmps">Service routing</text>

    <rect x="245" y="516" width="130" height="92" rx="10" fill="#272c34" stroke="#6b7480" stroke-dasharray="5 4"/>
    <text x="310" y="534" class="lblc" font-weight="600">Pod</text>
    <rect x="256" y="544" width="52" height="52" rx="6" fill="#0ea5e9"/>
    <text x="282" y="574" class="cmp" font-size="11">app</text>
    <rect x="314" y="544" width="52" height="52" rx="6" fill="#38bdf8"/>
    <text x="340" y="574" class="cmp" font-size="11">sidecar</text>

    <rect x="390" y="516" width="130" height="92" rx="10" fill="#272c34" stroke="#6b7480" stroke-dasharray="5 4"/>
    <text x="455" y="534" class="lblc" font-weight="600">Pod</text>
    <rect x="429" y="544" width="52" height="52" rx="6" fill="#0ea5e9"/>
    <text x="455" y="574" class="cmp" font-size="11">app</text>

    <rect x="245" y="620" width="275" height="44" rx="9" fill="#d97706"/>
    <text x="382" y="640" class="cmp" font-size="13">Container runtime (CRI)</text>
    <text x="382" y="656" class="cmps" fill="#fff7ed">containerd / CRI-O → runc</text>
    <rect x="245" y="674" width="275" height="50" rx="9" fill="#2b3340"/>
    <text x="382" y="694" class="cmp" font-size="13">Linux kernel</text>
    <text x="382" y="712" class="cmps">namespaces · cgroups · seccomp · eBPF</text>
  </g>

  <g>
    <rect x="555" y="420" width="305" height="320" rx="14" fill="#15291f" stroke="#2fa877" stroke-width="2"/>
    <text x="571" y="442" class="zone" fill="#4ade80">WORKER NODE 2</text>
    <rect x="570" y="456" width="130" height="46" rx="9" fill="#059669"/>
    <text x="635" y="477" class="cmp">kubelet</text>
    <text x="635" y="494" class="cmps">node agent</text>
    <rect x="715" y="456" width="130" height="46" rx="9" fill="#059669"/>
    <text x="780" y="477" class="cmp">kube-proxy</text>
    <text x="780" y="494" class="cmps">Service routing</text>

    <rect x="570" y="516" width="130" height="92" rx="10" fill="#272c34" stroke="#6b7480" stroke-dasharray="5 4"/>
    <text x="635" y="534" class="lblc" font-weight="600">Pod</text>
    <rect x="609" y="544" width="52" height="52" rx="6" fill="#0ea5e9"/>
    <text x="635" y="574" class="cmp" font-size="11">app</text>

    <rect x="715" y="516" width="130" height="92" rx="10" fill="#272c34" stroke="#6b7480" stroke-dasharray="5 4"/>
    <text x="780" y="534" class="lblc" font-weight="600">Pod</text>
    <rect x="726" y="544" width="52" height="52" rx="6" fill="#0ea5e9"/>
    <text x="752" y="574" class="cmp" font-size="11">app</text>
    <rect x="784" y="544" width="52" height="52" rx="6" fill="#38bdf8"/>
    <text x="810" y="574" class="cmp" font-size="11">proxy</text>

    <rect x="570" y="620" width="275" height="44" rx="9" fill="#d97706"/>
    <text x="707" y="640" class="cmp" font-size="13">Container runtime (CRI)</text>
    <text x="707" y="656" class="cmps" fill="#fff7ed">containerd / CRI-O → runc</text>
    <rect x="570" y="674" width="275" height="50" rx="9" fill="#2b3340"/>
    <text x="707" y="694" class="cmp" font-size="13">Linux kernel</text>
    <text x="707" y="712" class="cmps">namespaces · cgroups · seccomp · eBPF</text>
  </g>

  <!-- pod network -->
  <path d="M520,562 L570,562" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>

  <!-- end users -> node -->
  <path class="link" d="M200,593 L243,580" marker-end="url(#arr)"/>

  <!-- ===== Log collector ===== -->
  <rect x="885" y="420" width="120" height="320" rx="12" fill="#7c3aed"/>
  <text x="945" y="452" class="cmp" font-size="13">Log collector</text>
  <text x="945" y="476" class="cmps">Fluent Bit</text>
  <text x="945" y="492" class="cmps">OTel Collector</text>
  <text x="945" y="508" class="cmps">Falco sidekick</text>
  <text x="945" y="524" class="cmps">Vector</text>
  <text x="945" y="560" class="cmps">DaemonSet on</text>
  <text x="945" y="576" class="cmps">every node +</text>
  <text x="945" y="592" class="cmps">audit webhook /</text>
  <text x="945" y="608" class="cmps">cloud log export</text>
  <path d="M860,580 L883,580" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrP)"/>
  <path d="M860,360 C 900,370 935,390 940,418" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrP)"/>
  <path d="M1005,580 L1028,580" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrP)"/>
  <path d="M1005,283 L1028,283" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrP)"/>

  <!-- ===== SIEM ===== -->
  <rect x="1030" y="96" width="225" height="644" rx="14" fill="#12141a" stroke="#3a414c"/>
  <text x="1048" y="128" class="siemh">SIEM / SOAR</text>
  <text x="1048" y="148" class="siem" font-size="11.5" fill="#94a3b8">Splunk · Sentinel · Elastic · QRadar</text>
  <g>
    <circle cx="1058" cy="180" r="11" fill="#dc2626"/><text x="1058" y="184" class="badge">1</text>
    <text x="1076" y="184" class="siem">Kubernetes audit log</text>
    <circle cx="1058" cy="214" r="11" fill="#dc2626"/><text x="1058" y="218" class="badge">2</text>
    <text x="1076" y="218" class="siem">Admission / policy reports</text>
    <circle cx="1058" cy="248" r="11" fill="#dc2626"/><text x="1058" y="252" class="badge">3</text>
    <text x="1076" y="252" class="siem">etcd logs</text>
    <circle cx="1058" cy="282" r="11" fill="#dc2626"/><text x="1058" y="286" class="badge">4</text>
    <text x="1076" y="286" class="siem">Cloud audit (CloudTrail…)</text>
    <circle cx="1058" cy="316" r="11" fill="#dc2626"/><text x="1058" y="320" class="badge">5</text>
    <text x="1076" y="320" class="siem">Kubelet logs</text>
    <circle cx="1058" cy="350" r="11" fill="#dc2626"/><text x="1058" y="354" class="badge">6</text>
    <text x="1076" y="354" class="siem">Runtime security (Falco)</text>
    <circle cx="1058" cy="384" r="11" fill="#dc2626"/><text x="1058" y="388" class="badge">7</text>
    <text x="1076" y="388" class="siem">CNI flow + DNS logs</text>
    <circle cx="1058" cy="418" r="11" fill="#dc2626"/><text x="1058" y="422" class="badge">8</text>
    <text x="1076" y="422" class="siem">Container engine logs</text>
    <circle cx="1058" cy="452" r="11" fill="#dc2626"/><text x="1058" y="456" class="badge">9</text>
    <text x="1076" y="456" class="siem">Node auditd / FIM / EDR</text>
  </g>
  <line x1="1048" y1="486" x2="1237" y2="486" stroke="#3a414c"/>
  <text x="1048" y="514" class="siem" font-weight="700" fill="#ffffff">Detections</text>
  <text x="1048" y="536" class="siem">40 use cases (KSU-001…040)</text>
  <text x="1048" y="556" class="siem">MITRE ATT&amp;CK Containers</text>
  <text x="1048" y="576" class="siem">Correlation · enrichment</text>
  <text x="1048" y="596" class="siem">(namespace, pod, image, SA)</text>
  <text x="1048" y="630" class="siem" font-weight="700" fill="#ffffff">Response</text>
  <text x="1048" y="652" class="siem">Cordon node · isolate pod</text>
  <text x="1048" y="672" class="siem">Revoke token / binding</text>
  <text x="1048" y="692" class="siem">Snapshot for forensics</text>

  <!-- ===== numbered tap badges on the diagram ===== -->
  <g>
    <circle cx="690" cy="140" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="690" y="144" class="badge">1</text>
    <circle cx="690" cy="208" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="690" y="212" class="badge">2</text>
    <circle cx="250" cy="254" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="250" y="258" class="badge">3</text>
    <circle cx="1005" cy="246" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="1005" y="250" class="badge">4</text>
    <circle cx="375" cy="458" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="375" y="462" class="badge">5</text>
    <circle cx="700" cy="458" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="700" y="462" class="badge">5</text>
    <circle cx="520" cy="676" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="520" y="680" class="badge">6</text>
    <circle cx="845" cy="676" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="845" y="680" class="badge">6</text>
    <circle cx="545" cy="562" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="545" y="566" class="badge">7</text>
    <circle cx="520" cy="622" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="520" y="626" class="badge">8</text>
    <circle cx="845" cy="622" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="845" y="626" class="badge">8</text>
    <circle cx="245" cy="676" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="245" y="680" class="badge">9</text>
  </g>

  <text x="30" y="768" class="sub" font-size="11.5">KSU = Kubernetes SIEM Use Case. Badge numbers match the SIEM ingestion list on the right (7 = pod-to-pod CNI traffic).</text>
</svg>
